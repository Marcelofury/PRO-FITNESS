services:
  - type: web
    name: profitness-backend
    env: node
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
